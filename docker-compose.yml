services:
  postgres:
    image: postgres:16
    container_name: wayang-console-postgres
    environment:
      POSTGRES_DB: wayang_console
      POSTGRES_USER: wayang_console
      POSTGRES_PASSWORD: wayang_console
    ports:
      - "5432:5432"
    volumes:
      - wayang-console-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayang_console -d wayang_console"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wayang-console-postgres-data:
