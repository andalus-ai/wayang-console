databaseChangeLog:
  - changeSet:
      id: 001-runtime-registry
      author: andalus-ai
      changes:
        - createTable:
            tableName: wc_enrollment_token
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: token_hash, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: organization_id, type: UUID, constraints: { nullable: false } }
              - column: { name: environment_id, type: UUID, constraints: { nullable: false } }
              - column: { name: expires_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: consumed_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - createTable:
            tableName: wc_runtime_instance
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: instance_id, type: VARCHAR(160), constraints: { nullable: false } }
              - column: { name: organization_id, type: UUID, constraints: { nullable: false } }
              - column: { name: environment_id, type: UUID, constraints: { nullable: false } }
              - column: { name: runtime_version, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: deployment_id, type: VARCHAR(160) }
              - column: { name: hostname, type: VARCHAR(255) }
              - column: { name: platform, type: VARCHAR(120) }
              - column: { name: status, type: VARCHAR(24), constraints: { nullable: false } }
              - column: { name: health_status, type: VARCHAR(24), constraints: { nullable: false } }
              - column: { name: registration_token_hash, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: registration_expires_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: registered_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: last_seen_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: lease_expires_at, type: TIMESTAMP WITH TIME ZONE }
        - addUniqueConstraint:
            tableName: wc_runtime_instance
            columnNames: organization_id, instance_id
            constraintName: uk_wc_runtime_instance
        - createIndex:
            tableName: wc_runtime_instance
            indexName: idx_wc_runtime_scope
            columns:
              - column: { name: organization_id }
              - column: { name: environment_id }
        - createTable:
            tableName: wc_runtime_capability
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: runtime_id, type: UUID, constraints: { nullable: false } }
              - column: { name: component_id, type: VARCHAR(180), constraints: { nullable: false } }
              - column: { name: version, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: capability, type: VARCHAR(180), constraints: { nullable: false } }
        - createTable:
            tableName: wc_workflow_reference
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: runtime_id, type: UUID, constraints: { nullable: false } }
              - column: { name: workflow_id, type: VARCHAR(180), constraints: { nullable: false } }
              - column: { name: workflow_version, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: definition_digest, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: deployment_id, type: VARCHAR(160), constraints: { nullable: false } }
      rollback:
        - dropTable: { tableName: wc_workflow_reference }
        - dropTable: { tableName: wc_runtime_capability }
        - dropTable: { tableName: wc_runtime_instance }
        - dropTable: { tableName: wc_enrollment_token }

  - changeSet:
      id: 002-operator-fleet-security-audit
      author: andalus-ai
      changes:
        - addColumn:
            tableName: wc_enrollment_token
            columns:
              - column: { name: revoked_at, type: TIMESTAMP WITH TIME ZONE }
        - createTable:
            tableName: wc_audit_record
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: organization_id, type: UUID, constraints: { nullable: false } }
              - column: { name: environment_id, type: UUID }
              - column: { name: actor_subject, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: action, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: resource_type, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: resource_id, type: VARCHAR(180), constraints: { nullable: false } }
              - column: { name: occurred_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: outcome, type: VARCHAR(24), constraints: { nullable: false } }
        - createIndex:
            tableName: wc_audit_record
            indexName: idx_wc_audit_scope_time
            columns:
              - column: { name: organization_id }
              - column: { name: occurred_at }
        - createIndex:
            tableName: wc_audit_record
            indexName: idx_wc_audit_resource
            columns:
              - column: { name: resource_type }
              - column: { name: resource_id }
      rollback:
        - dropTable: { tableName: wc_audit_record }
        - dropColumn: { tableName: wc_enrollment_token, columnName: revoked_at }
