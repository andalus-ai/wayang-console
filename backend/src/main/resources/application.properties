quarkus.application.name=wayang-console
quarkus.http.port=8080
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:wayang_console}
quarkus.datasource.password=${DB_PASSWORD:wayang_console}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/wayang_console}
quarkus.hibernate-orm.database.generation=validate
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

wayang.console.registration.enabled=true
wayang.console.management.commands.enabled=false
wayang.console.tenant.mode=standalone
# Reconciliation health SLA thresholds (seconds); environment variables may override.
# Warning must be positive; critical must exceed warning and be <= 30 days.
wayang.console.reconciliation.sla.warning-seconds=${WAYANG_CONSOLE_RECONCILIATION_SLA_WARNING_SECONDS:300}
wayang.console.reconciliation.sla.critical-seconds=${WAYANG_CONSOLE_RECONCILIATION_SLA_CRITICAL_SECONDS:900}
%dev.quarkus.log.category."ai.wayang.console".level=DEBUG

# Production operator authentication. The OIDC provider validates JWT signatures
# through its discovery/JWKS metadata. Do not use a static development key in prod.
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${WAYANG_CONSOLE_OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${WAYANG_CONSOLE_OIDC_CLIENT_ID:wayang-console}
%prod.quarkus.oidc.token.issuer=${WAYANG_CONSOLE_OIDC_ISSUER}
%prod.quarkus.oidc.token.audience=${WAYANG_CONSOLE_OIDC_AUDIENCE:wayang-console}
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.token.subject-required=true
%test.quarkus.oidc.enabled=false
wayang.console.artifacts.root=${WAYANG_CONSOLE_ARTIFACTS_ROOT:./data/artifacts}
wayang.console.artifacts.max-size-bytes=${WAYANG_CONSOLE_ARTIFACTS_MAX_SIZE_BYTES:268435456}
wayang.console.artifacts.ed25519-public-key=${WAYANG_CONSOLE_ARTIFACT_SIGNING_PUBLIC_KEY:}
wayang.console.artifacts.require-registered=false
%prod.wayang.console.artifacts.require-registered=true
wayang.console.artifacts.signing-key-id=${WAYANG_CONSOLE_ARTIFACT_SIGNING_KEY_ID:}
