quarkus.application.name=wayang-console
quarkus.http.port=8080
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# Enrollment and command endpoints remain disabled until security adapters are configured.
wayang.console.registration.enabled=false
wayang.console.management.commands.enabled=false
wayang.console.tenant.mode=standalone
%dev.quarkus.log.category."ai.wayang.console".level=DEBUG
