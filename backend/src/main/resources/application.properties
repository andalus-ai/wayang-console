quarkus.application.name=wayang-console
quarkus.http.port=8080
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:wayang_console}
quarkus.datasource.password=${DB_PASSWORD:wayang_console}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/wayang_console}
quarkus.hibernate-orm.database.generation=validate
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

wayang.console.registration.enabled=true
wayang.console.management.commands.enabled=false
wayang.console.tenant.mode=standalone
%dev.quarkus.log.category."ai.wayang.console".level=DEBUG
